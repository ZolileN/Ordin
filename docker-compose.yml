services:
  postgres:
    image: postgres:16-alpine
    container_name: ordin-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ordin
      POSTGRES_PASSWORD: ordin
      POSTGRES_DB: ordin
    volumes:
      - ordin_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ordin -d ordin"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ordin_postgres_data:
